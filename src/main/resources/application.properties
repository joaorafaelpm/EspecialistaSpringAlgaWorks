spring.application.name=algafood-auth
server.port=8081
spring.security.oauth2.authorizationserver.issuer=http://localhost:8081
logging.level.org.springframework.security=DEBUG

spring.datasource.url=jdbc:mysql://localhost:3307/algafood?createDatabaseIfNotExists=true&serverTimeZone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.baselineOnMigrate = true

