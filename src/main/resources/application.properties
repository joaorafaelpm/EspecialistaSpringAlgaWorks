spring.application.name=algafood-api
#spring.profiles.active=development
server.port=8080

spring.messages.encoding=UTF-8

#DB
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3307/algafood?createDatabaseIfNotExists=true&serverTimeZone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.flyway.baselineOnMigrate = true

#Debug  do flyway
#logging.level.org.flywaydb=DEBUG
#logging.level.db.migration=DEBUG


#  Isso cria os scripts do DDL do hibernate (é o que cria as tabelas baseado nas entidades) porém neste caso isso abstrai somente o código, ento a gente pode gerar todas as tabelas de um jeito mais seguro com o próprio script do hibernate
#spring.jpa.properties.javax.persistence.schema-generation.scripts.action=create
#spring.jpa.properties.javax.persistence.schema-generation.scripts.create-target=src/main/resources/ddl.sql
spring.flyway.locations=classpath:db/migration, classpath:db/testdata

#DB - Redis

spring.session.store-type=none

#Debug
#logging.level.org.springframework.security.web.FilterChainProxy=TRACE
#logging.level.org.springframework=DEBUG

# Mostra todas as queries SQL feitas pelo Hibernate
spring.jpa.show-sql=true
# Formata as queries para facilitar a leitura
spring.jpa.properties.hibernate.format_sql=true

# (Opcional) Mostra valores dos parmetros das queries (ex: "WHERE id = 1")
logging.level.org.hibernate.type.descriptor.sql=TRACE

#Hikari
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=3
#10 segundos
spring.datasource.hikari.idle-timeout=10000

#Jackson
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-ignored-properties=true

# Na versão do Spring do curso ele nao lancava a exception correta e colocar essas configuracoes era necessario, porem, nesta versao ele lanca normalmente, mas esta ai caso eu precise utilizar
spring.mvc.throw-exception-if-no-handler-found=true
spring.resource.add-mappings=false

# Diretorio de fotos
algafood.storage.local.direction.diretorio-fotos= J:\\JavaSpring\\algaworks-api\\algafood-api\\catalogo

#Como eu não tenho cartão de crédito por ser menor de idade e muito menos internacional, eu não consigo me cadastrar na Amazon AWS, mas a princípio o projeto deveria ser continuado com ela, não deve ser um problema muito grande implementa-la, dito isso, vou continuar usando o meu disco local para manter os arquivos da foto
#Vale mensionar, que o ideal seria eu ter os dois e alternasse de acordo com o meu desenvolvimento, mudando o path para o disco local em caso de desenvolvimento e para o s3 da AWS em produço, o que tabm não  dor de cabeça, porm  inutil para mim ento para referências futuras, fica aqui a ideia.
#algafood.storage.s3.id-chave-acesso=

#Email
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=${API_EMAIL_KEY}

spring.mail.properties.mail.smtp.replyto=tester.email.sender@pendezzapizza.com
algafood.email.remetente=Pendezza Pizza <email.teste.pendezzapizza.tcc@gmail.com>

#algafood.email.impl = sandbox
algafood.email.impl = mock
#algafood.email.impl = smtp
algafood.email.sandbox.destinatario = email.teste.pendezzapizza.tcc@gmail.com

#Linguagem
# Mudando os valores das moedas do e-mail para Real e com vrgula (R$ , ",")
spring.freemarker.settings.locale=pt_BR


#Respostas
#Isso comprime respostas com o padro de tamanho de 2 Kb
server.compression.enabled=true

#Autenticação
#Uris de verificação de tokens transparentes/jwt
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/oauth2/jwks

algafood.jwt.keystore.jks-location=base64:
#Estou mantendo a senha como "dev" para gerar uma keyPair nova toda vez que eu reiniciar a aplicação, ao invés de usar uma fixa, isso é menos seguro porém é mais ideal em desenvolvimento
algafood.jwt.keystore.password=dev
#Isso serve para não manter o login em cookie, para não salva-lo e poder testar sem remover o cookie gerado
server.servlet.session.persistence=false
server.servlet.session.timeout=1m
#algafood.jwt.keystore.password=123456
algafood.jwt.keystore.keypair-alias=algafood
