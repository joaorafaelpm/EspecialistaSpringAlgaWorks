#Podemos específicar as menssagens como se fossem filtros, então todos os nomes vão alterar o texto 'nome' para maiúsculo e todos os nomes de restaurantes vão mudar o texto para dizer "Nome do Restaurante"
NotBlank = {0} é obrigatório.
NotNull = {0} não pode ser vazio.
PositiveOrZero = {0} deve ser positivo ou zero.

#Validação customizada, o Spring sempre levará como prioridade a anotação que a gente "herda", neste caso isso é inútil já que a gente herda positive or zero, porém uma forma de circular isso é criando uma anotação com regra ne validação em java 100% personalizada, e então ela terá uma menssagem única

#TaxaFrete.invalida = {0} está inválida.

PositivoOuZero = {0} não deve ser vazio e deve ser maior que zero.
ValorZeroIncluiDescricao = {1} deve coter {2}.

#Restaurante
NotNull.restaurante.taxaFrete={0} é obrigatória
NotNull.restaurante.cozinha={0} é obrigatória
restaurante.nome = Nome do restaurante
restaurante.cozinha.id = Id da cozinha
restaurante.taxaFrete = Taxa do Frete 

#Cozinha
cozinha.nome=Nome da cozinha
cozinha.id=Código da cozinha

#Estado
estado.nome=Nome do estado
estado.id=Código do estado

# Cidade
cidade.nome=Nome da cidade
